apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: camunda-jobs-new
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/selflearner2025/domain-based-repo.git
        revision: test
        directories:
          - path: jobs/*/*
  template:
    metadata:
      name: '{{path.basename}}-application' 
    spec:
      project: default
      source:
        repoURL: https://github.com/selflearner2025/domain-based-repo.git
        targetRevision: test
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path[1]}}-namespace'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
         
